name: no-infra-identifiers
on: [pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The INFRA_IDENTIFIERS repository secret must hold the pipe-separated
      # identifier regex (real infra identifiers are never committed).
      - name: Check for AWS-infra identifiers
        env:
          STRIMSERVER_INFRA_IDENTIFIERS: ${{ secrets.INFRA_IDENTIFIERS }}
        run: tools/check-no-infra-identifiers.sh
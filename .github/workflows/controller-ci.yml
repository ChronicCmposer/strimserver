# CI for the strimserver controller and the deployment package.
#
# controller-tests runs the controller unit tests, lint, and codegen
# staleness checks (`bazel test //core/controller:all`). package-build
# assembles the full deployment bundle (`//:package`) after bootstrapping
# core/strimserver.env from the example, mirroring `make prepare`.
#
# NOTE: the alternate assembly controller (core/controller/alternate/asm +
# alternate/c) is a MANUAL build — its targets are not matched by the
# //core/controller:all or //:package wildcards below. It is intentionally
# absent from default CI; build it explicitly when needed.
#
# The pinned ffmpeg artifact has its own weekly reproducibility canary
# (.github/workflows/ffmpeg-reproducibility.yml); this workflow covers
# the normal test/build path on every pull request.
name: controller-ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Run controller tests
        run: bazel test //core/controller:all

      - name: Run secret-hygiene test
        run: bazel test //core:security_hygiene_test

      - name: Run check-deps tests
        run: bazel test //tools/check-deps:all

      - name: Run pin oracle
        run: bazel test //tools/deps-pins:all

      - name: Run deploy/aws tests
        run: bazel test //deploy/aws:all

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Bootstrap the runtime env file
        run: cp core/strimserver.env.example core/strimserver.env

      - name: Build the deployment package
        run: bazel build //:package

      - name: Build the arm64 deployment package
        run: bazel build //:package_arm64

      - name: Build all four deployment bundles (Go + C, amd64 + arm64)
        run: bazel build //:package_all
# Vendored from stackctl v0.1.26 -- re-copy on upgrade (see STACKCTL_MIGRATION.md).
Description: stackctl regional infra stack - VPC, subnet, security group, retained buckets, optional Image Builder and spot alerts.
Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9]+$"
    Description: Project identifier - hyphen-free and equal to the stack name prefix. The per-REGION length bound (derived from the longest S3 bucket name) is enforced by stackctl config validation, the single source of truth.
  ReleaseTag:
    Type: String
    Default: ""
    Description: Release tag recorded as stack metadata and resource metadata. Empty during the first-deploy CREATE bootstrap so the artifact bucket exists before stackctl publishes.
  ReleaseManifestSha256:
    Type: String
    Default: ""
    AllowedPattern: "^([a-f0-9]{64})?$"
    Description: SHA-256 of the release manifest recorded as resource metadata. Empty during the first-deploy CREATE bootstrap; set by the recording UPDATE.
  AmiPolicy:
    Type: String
    AllowedValues:
      - pinned
      - ssm
      - baked
    Default: ssm
    Description: AMI resolution policy - only pinned carries explicit AMI ids.
  AmiIdAmd64:
    Type: String
    Default: ""
    Description: Pinned amd64 AMI id used when AmiPolicy is pinned.
  AmiIdArm64:
    Type: String
    Default: ""
    Description: Pinned arm64 AMI id used when AmiPolicy is pinned.
  ImageBuilderParentImage:
    Type: String
    Default: ""
    Description: "Image Builder parent image: an EC2 AMI id (ami-...) or a full SSM parameter ARN (arn:aws:ssm:...). Required when EnableImageBuilder is true."
  NvidiaFloorMachineryUrl:
    Type: String
    Default: "https://raw.githubusercontent.com/ChronicCmposer/strimserver/dev/deploy/aws/lib/nvidia.sh"
    Description: "Location of the repo's lib/nvidia.sh -- the single source of truth for the driver floor and the stage-then-swap upgrade. The Image Builder component sources it instead of duplicating the floor logic. Point this at the exact revision you are deploying (a fork or a release tag)."
  OpensshExperimentalRpmUrl:
    Type: String
    Default: "https://github.com/ChronicCmposer/strimserver/releases/download/openssh-dist/openssh-experimental.rpm"
    Description: "The pinned @openssh_dist openssh-experimental RPM (see MODULE.bazel s3_key openssh/openssh-experimental.rpm) baked into the image."
  OperatorCidr:
    Type: String
    Default: ""
    Description: CIDR allowed to SSH to the instance - empty omits the SSH ingress rule.
  IngressTcp:
    Type: CommaDelimitedList
    Default: "443"
    Description: INGRESS_TCP - comma list of port[:cidr] application TCP rules (audit copy). stackctl expands each item into the indexed IngressTcpPort<N>/IngressTcpCidr<N> parameters below; an item without :cidr uses the documented default 0.0.0.0/0.
  IngressUdp:
    Type: CommaDelimitedList
    Default: "53"
    Description: INGRESS_UDP - comma list of port[:cidr] application UDP rules (audit copy). stackctl expands each item into the indexed IngressUdpPort<N>/IngressUdpCidr<N> parameters below; an item without :cidr uses the documented default 0.0.0.0/0.
  IngressTcpPort0:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 0 - empty disables the rule.
  IngressTcpCidr0:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 0 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort1:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 1 - empty disables the rule.
  IngressTcpCidr1:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 1 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort2:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 2 - empty disables the rule.
  IngressTcpCidr2:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 2 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort3:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 3 - empty disables the rule.
  IngressTcpCidr3:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 3 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort4:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 4 - empty disables the rule.
  IngressTcpCidr4:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 4 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort5:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 5 - empty disables the rule.
  IngressTcpCidr5:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 5 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort6:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 6 - empty disables the rule.
  IngressTcpCidr6:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 6 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressTcpPort7:
    Type: String
    Default: ""
    Description: Application TCP port for INGRESS_TCP item 7 - empty disables the rule.
  IngressTcpCidr7:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_TCP item 7 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort0:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 0 - empty disables the rule.
  IngressUdpCidr0:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 0 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort1:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 1 - empty disables the rule.
  IngressUdpCidr1:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 1 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort2:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 2 - empty disables the rule.
  IngressUdpCidr2:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 2 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort3:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 3 - empty disables the rule.
  IngressUdpCidr3:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 3 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort4:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 4 - empty disables the rule.
  IngressUdpCidr4:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 4 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort5:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 5 - empty disables the rule.
  IngressUdpCidr5:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 5 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort6:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 6 - empty disables the rule.
  IngressUdpCidr6:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 6 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  IngressUdpPort7:
    Type: String
    Default: ""
    Description: Application UDP port for INGRESS_UDP item 7 - empty disables the rule.
  IngressUdpCidr7:
    Type: String
    Default: ""
    Description: Source CIDR for INGRESS_UDP item 7 - set from port[:cidr] or 0.0.0.0/0 when the item omits a CIDR.
  CertBucketEnabled:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: Create the certificate bucket module when true.
  DdnsHost:
    Type: String
    Default: ""
    Description: Namecheap dynamic DNS host for this project.
  DdnsDomain:
    Type: String
    Default: ""
    Description: Namecheap domain that owns the dynamic DNS host.
  EnableImageBuilder:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Create the baked-image pipeline when true.
  EnableSpotAlerts:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: Create the spot-interruption alert module when true.
  SpotAlertEmail:
    Type: String
    Default: ""
    Description: Email address subscribed to spot-interruption warnings.
Conditions:
  AmiPinned: !Equals [!Ref AmiPolicy, "pinned"]
  CertBucketEnabledCondition: !Equals [!Ref CertBucketEnabled, "true"]
  HasOperatorCidr: !Not [!Equals [!Ref OperatorCidr, ""]]
  HasDdnsHost: !Not [!Equals [!Ref DdnsHost, ""]]
  EnableImageBuilderCondition: !Equals [!Ref EnableImageBuilder, "true"]
  EnableSpotAlertsCondition: !Equals [!Ref EnableSpotAlerts, "true"]
  HasIngressTcp0: !And [!Not [!Equals [!Ref IngressTcpPort0, ""]], !Not [!Equals [!Ref IngressTcpCidr0, ""]]]
  HasIngressTcp1: !And [!Not [!Equals [!Ref IngressTcpPort1, ""]], !Not [!Equals [!Ref IngressTcpCidr1, ""]]]
  HasIngressTcp2: !And [!Not [!Equals [!Ref IngressTcpPort2, ""]], !Not [!Equals [!Ref IngressTcpCidr2, ""]]]
  HasIngressTcp3: !And [!Not [!Equals [!Ref IngressTcpPort3, ""]], !Not [!Equals [!Ref IngressTcpCidr3, ""]]]
  HasIngressTcp4: !And [!Not [!Equals [!Ref IngressTcpPort4, ""]], !Not [!Equals [!Ref IngressTcpCidr4, ""]]]
  HasIngressTcp5: !And [!Not [!Equals [!Ref IngressTcpPort5, ""]], !Not [!Equals [!Ref IngressTcpCidr5, ""]]]
  HasIngressTcp6: !And [!Not [!Equals [!Ref IngressTcpPort6, ""]], !Not [!Equals [!Ref IngressTcpCidr6, ""]]]
  HasIngressTcp7: !And [!Not [!Equals [!Ref IngressTcpPort7, ""]], !Not [!Equals [!Ref IngressTcpCidr7, ""]]]
  HasIngressUdp0: !And [!Not [!Equals [!Ref IngressUdpPort0, ""]], !Not [!Equals [!Ref IngressUdpCidr0, ""]]]
  HasIngressUdp1: !And [!Not [!Equals [!Ref IngressUdpPort1, ""]], !Not [!Equals [!Ref IngressUdpCidr1, ""]]]
  HasIngressUdp2: !And [!Not [!Equals [!Ref IngressUdpPort2, ""]], !Not [!Equals [!Ref IngressUdpCidr2, ""]]]
  HasIngressUdp3: !And [!Not [!Equals [!Ref IngressUdpPort3, ""]], !Not [!Equals [!Ref IngressUdpCidr3, ""]]]
  HasIngressUdp4: !And [!Not [!Equals [!Ref IngressUdpPort4, ""]], !Not [!Equals [!Ref IngressUdpCidr4, ""]]]
  HasIngressUdp5: !And [!Not [!Equals [!Ref IngressUdpPort5, ""]], !Not [!Equals [!Ref IngressUdpCidr5, ""]]]
  HasIngressUdp6: !And [!Not [!Equals [!Ref IngressUdpPort6, ""]], !Not [!Equals [!Ref IngressUdpCidr6, ""]]]
  HasIngressUdp7: !And [!Not [!Equals [!Ref IngressUdpPort7, ""]], !Not [!Equals [!Ref IngressUdpCidr7, ""]]]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      stackctl:release-tag: !Ref ReleaseTag
      stackctl:release-sha: !Ref ReleaseManifestSha256
      stackctl:ami-policy: !Ref AmiPolicy
      stackctl:ami-amd64: !If [AmiPinned, !Ref AmiIdAmd64, ""]
      stackctl:ami-arm64: !If [AmiPinned, !Ref AmiIdArm64, ""]
      stackctl:ddns-host: !Ref DdnsHost
      stackctl:ddns-domain: !Ref DdnsDomain
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-igw
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-public-rt
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-public-subnet
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      stackctl:ingress-tcp: !Ref IngressTcp
      stackctl:ingress-udp: !Ref IngressUdp
    Properties:
      GroupDescription: !Sub ${ProjectName} application security group
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-sg
  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasOperatorCidr
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref OperatorCidr
  TcpIngress0:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp0
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort0
      ToPort: !Ref IngressTcpPort0
      CidrIp: !Ref IngressTcpCidr0
  TcpIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp1
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort1
      ToPort: !Ref IngressTcpPort1
      CidrIp: !Ref IngressTcpCidr1
  TcpIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp2
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort2
      ToPort: !Ref IngressTcpPort2
      CidrIp: !Ref IngressTcpCidr2
  TcpIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp3
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort3
      ToPort: !Ref IngressTcpPort3
      CidrIp: !Ref IngressTcpCidr3
  TcpIngress4:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp4
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort4
      ToPort: !Ref IngressTcpPort4
      CidrIp: !Ref IngressTcpCidr4
  TcpIngress5:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp5
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort5
      ToPort: !Ref IngressTcpPort5
      CidrIp: !Ref IngressTcpCidr5
  TcpIngress6:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp6
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort6
      ToPort: !Ref IngressTcpPort6
      CidrIp: !Ref IngressTcpCidr6
  TcpIngress7:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressTcp7
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: !Ref IngressTcpPort7
      ToPort: !Ref IngressTcpPort7
      CidrIp: !Ref IngressTcpCidr7
  UdpIngress0:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp0
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort0
      ToPort: !Ref IngressUdpPort0
      CidrIp: !Ref IngressUdpCidr0
  UdpIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp1
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort1
      ToPort: !Ref IngressUdpPort1
      CidrIp: !Ref IngressUdpCidr1
  UdpIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp2
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort2
      ToPort: !Ref IngressUdpPort2
      CidrIp: !Ref IngressUdpCidr2
  UdpIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp3
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort3
      ToPort: !Ref IngressUdpPort3
      CidrIp: !Ref IngressUdpCidr3
  UdpIngress4:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp4
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort4
      ToPort: !Ref IngressUdpPort4
      CidrIp: !Ref IngressUdpCidr4
  UdpIngress5:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp5
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort5
      ToPort: !Ref IngressUdpPort5
      CidrIp: !Ref IngressUdpCidr5
  UdpIngress6:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp6
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort6
      ToPort: !Ref IngressUdpPort6
      CidrIp: !Ref IngressUdpCidr6
  UdpIngress7:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngressUdp7
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: udp
      FromPort: !Ref IngressUdpPort7
      ToPort: !Ref IngressUdpPort7
      CidrIp: !Ref IngressUdpCidr7
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-artifacts
  CertBucket:
    Type: AWS::S3::Bucket
    Condition: CertBucketEnabledCondition
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-certs-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${ProjectName}-certs
  BakedImageComponent:
    Type: AWS::ImageBuilder::Component
    Condition: EnableImageBuilderCondition
    Properties:
      Name: !Sub ${ProjectName}-baked-image-component
      Platform: Linux
      # Version bumps are REQUIRED on any Data change: Data is a replacement
      # property, and Image Builder refuses to recreate Name/Version pairs
      # that already exist (the 1.0.0 AlreadyExists trap).
      Version: 1.0.1
      Description: strimserver baked base (driver floor, htop, openssh, containerd)
      # Fn::Sub interpolates ONLY the two URL parameters; the sourced nvidia.sh
      # owns the floor version and the stage-then-swap logic, so a threshold
      # bump is a one-line change in deploy/aws/lib/nvidia.sh.
      Data: !Sub "name: strimserver-baked-base\ndescription: strimserver baked base\nschemaVersion: 1.0\nphases:\n  - name: build\n    steps:\n      - name: InstallBaseTools\n        action: ExecuteBash\n        inputs:\n          commands:\n            - |\n              set -euo pipefail\n              mkdir -p /etc/containerd\n              if [ -f /etc/containerd/config.toml ]; then\n                grep -vE '^[[:space:]]*(root|state)[[:space:]]*=' /etc/containerd/config.toml > /tmp/containerd.toml || true\n              else\n                : > /tmp/containerd.toml\n              fi\n              cat > /etc/containerd/config.toml <<'STRIMSERVER_CONTAINERD_CONFIG_EOF'\n              root='/mnt/nvme/containerd'\n              state='/mnt/nvme/containerd-state'\n\n              STRIMSERVER_CONTAINERD_CONFIG_EOF\n              cat /tmp/containerd.toml >> /etc/containerd/config.toml\n              mkdir -p /etc/systemd/system/containerd.service.d\n              cat > /etc/systemd/system/containerd.service.d/10-strimserver-nvme.conf <<'STRIMSERVER_CONTAINERD_NVME_EOF'\n              [Unit]\n              ConditionPathIsMountPoint=/mnt/nvme\n              STRIMSERVER_CONTAINERD_NVME_EOF\n              dnf install -y htop\n              systemctl enable nvidia-persistenced\n      - name: EstablishNvidiaDriverFloor\n        action: ExecuteBash\n        inputs:\n          commands:\n            - |\n              set -euo pipefail\n              curl -fsSL \"${NvidiaFloorMachineryUrl}\" -o /tmp/nvidia.sh\n              . /tmp/nvidia.sh\n              SUDO=\"\" nvidia_ensure_driver_floor\n      - name: PurgeStaleNvidiaDkms\n        action: ExecuteBash\n        inputs:\n          commands:\n            - |\n              set -euo pipefail\n              if [ ! -f /tmp/nvidia.sh ]; then\n                curl -fsSL \"${NvidiaFloorMachineryUrl}\" -o /tmp/nvidia.sh\n              fi\n              . /tmp/nvidia.sh\n              FLOOR=\"$NVIDIA_DRIVER_FLOOR\"\n              if [ -z \"$FLOOR\" ]; then\n                echo \"PurgeStaleNvidiaDkms: NVIDIA_DRIVER_FLOOR is empty\" >&2\n                exit 1\n              fi\n              if command -v dkms >/dev/null 2>&1; then\n                status=\"$(dkms status 2>/dev/null || true)\"\n                while IFS= read -r entry; do\n                  [ -n \"$entry\" ] || continue\n                  name=\"$(printf '%s' \"$entry\" | cut -d/ -f1)\"\n                  version=\"$(printf '%s' \"$entry\" | cut -d/ -f2)\"\n                  if [ \"$version\" = \"$FLOOR\" ]; then\n                    continue\n                  fi\n                  if ! dkms remove \"$name/$version\" --all; then\n                    echo \"PurgeStaleNvidiaDkms: dkms remove $name/$version --all failed\" >&2\n                    exit 1\n                  fi\n                done < <(printf '%s\\n' \"$status\" | grep -oE 'nvidia[A-Za-z0-9_.-]*/[0-9]+([.][0-9]+)*' | sort -u)\n              fi\n              for src in /usr/src/nvidia*; do\n                [ -e \"$src\" ] || continue\n                src_base=\"$(basename \"$src\")\"\n                case \"$src_base\" in\n                  *\"-$FLOOR\") : ;;\n                  *)\n                    rm -rf \"$src\"\n                    ;;\n                esac\n              done\n              systemctl disable nvidia-kmod-load.service 2>/dev/null || true\n              mkdir -p /etc/systemd/system\n              ln -sf /dev/null /etc/systemd/system/nvidia-kmod-load.service\n              if [ ! -L /etc/systemd/system/nvidia-kmod-load.service ]; then\n                echo \"PurgeStaleNvidiaDkms: nvidia-kmod-load.service is not masked\" >&2\n                exit 1\n              fi\n              rm -rf /var/lib/dkms-archive/nvidia* 2>/dev/null || true\n              if compgen -G '/var/lib/dkms-archive/nvidia*' >/dev/null; then\n                echo \"PurgeStaleNvidiaDkms: nvidia DKMS archives remain under /var/lib/dkms-archive\" >&2\n                exit 1\n              fi\n              kernel_list=\"$(ls -1 /lib/modules 2>/dev/null || true)\"\n              if [ -z \"$kernel_list\" ]; then\n                echo \"PurgeStaleNvidiaDkms: no kernels found under /lib/modules\" >&2\n                exit 1\n              fi\n              if command -v dkms >/dev/null 2>&1; then\n                status=\"$(dkms status 2>/dev/null || true)\"\n                floor_token=\"$(printf '%s\\n' \"$status\" | grep -oE 'nvidia[A-Za-z0-9_.-]*/[0-9]+([.][0-9]+)*' | awk -F/ -v f=\"$FLOOR\" '$2 == f {print; exit}')\"\n                floor_name=\"$(printf '%s' \"$floor_token\" | cut -d/ -f1)\"\n                if [ -z \"$floor_name\" ]; then\n                  for candidate in nvidia nvidia-open; do\n                    if [ -f \"/usr/src/$candidate-$FLOOR/dkms.conf\" ]; then\n                      floor_name=\"$candidate\"\n                      break\n                    fi\n                  done\n                  if [ -z \"$floor_name\" ]; then\n                    echo \"PurgeStaleNvidiaDkms: no DKMS source for $FLOOR under /usr/src\" >&2\n                    exit 1\n                  fi\n                  if ! dkms add \"$floor_name/$FLOOR\"; then\n                    echo \"PurgeStaleNvidiaDkms: dkms add $floor_name/$FLOOR failed\" >&2\n                    exit 1\n                  fi\n                fi\n                for kernel in $kernel_list; do\n                  status=\"$(dkms status 2>/dev/null || true)\"\n                  if printf '%s\\n' \"$status\" | grep -F \"$floor_name/$FLOOR,\" | grep -F \"$kernel\" | grep -F \"installed\" >/dev/null; then\n                    continue\n                  fi\n                  if ! dkms install -m \"$floor_name\" -v \"$FLOOR\" -k \"$kernel\"; then\n                    echo \"PurgeStaleNvidiaDkms: dkms install $floor_name/$FLOOR for $kernel failed\" >&2\n                    exit 1\n                  fi\n                done\n              else\n                if compgen -G '/usr/src/nvidia*' >/dev/null || [ -d /var/lib/dkms ]; then\n                  echo \"PurgeStaleNvidiaDkms: dkms is absent but stale DKMS state remains\" >&2\n                  exit 1\n                fi\n              fi\n              for pkg in nvidia-fabricmanager libnvidia-nscq; do\n                if rpm -q \"$pkg\" >/dev/null 2>&1; then\n                  installed_version=\"$(rpm -q --qf '%{VERSION}\\n' \"$pkg\" | head -n1)\"\n                  if [ -z \"$installed_version\" ]; then\n                    echo \"PurgeStaleNvidiaDkms: cannot read installed version of $pkg\" >&2\n                    exit 1\n                  fi\n                  if [ \"$installed_version\" != \"$FLOOR\" ]; then\n                    if ! dnf remove -y \"$pkg-$installed_version\"; then\n                      echo \"PurgeStaleNvidiaDkms: dnf remove $pkg-$installed_version failed\" >&2\n                      exit 1\n                    fi\n                  fi\n                fi\n              done\n              if ! depmod -a; then\n                echo \"PurgeStaleNvidiaDkms: depmod -a failed\" >&2\n                exit 1\n              fi\n              for kernel in $kernel_list; do\n                for module in nvidia nvidia-uvm; do\n                  observed=\"$(modinfo -k \"$kernel\" -F version \"$module\" 2>/dev/null || true)\"\n                  if [ \"$observed\" != \"$FLOOR\" ]; then\n                    echo \"PurgeStaleNvidiaDkms: on-disk $module module for kernel $kernel reports '$observed', expected $FLOOR; refusing to bake\" >&2\n                    exit 1\n                  fi\n                done\n              done\n      - name: InstallExperimentalOpenSsh\n        action: ExecuteBash\n        inputs:\n          commands:\n            - |\n              set -euo pipefail\n              curl -fsSL \"${OpensshExperimentalRpmUrl}\" -o /tmp/openssh-experimental.rpm\n              dnf install -y /tmp/openssh-experimental.rpm\n      - name: CleanNvmeResidue\n        action: ExecuteBash\n        inputs:\n          commands:\n            - |\n              set -euo pipefail\n              systemctl stop containerd.service containerd.socket 2>/dev/null || true\n              rm -rf /mnt/nvme/nvidia-rpm /mnt/nvme/containerd /mnt/nvme/containerd-state\n              if [ -d /mnt/nvme ]; then\n                if ! residue=\"$(find /mnt/nvme -mindepth 1 -print -quit)\"; then\n                  echo \"CleanNvmeResidue: cannot inspect /mnt/nvme; failing closed\" >&2\n                  exit 1\n                fi\n                if [ -n \"$residue\" ]; then\n                  echo \"CleanNvmeResidue: /mnt/nvme is not empty after cleanup\" >&2\n                  exit 1\n                fi\n              fi\n              if [ -e /var/lib/strimserver/driver-upgrade.state ]; then\n                echo \"CleanNvmeResidue: /var/lib/strimserver/driver-upgrade.state present; refusing to bake\" >&2\n                exit 1\n              fi"
  BakedImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Condition: EnableImageBuilderCondition
    Properties:
      Name: !Sub ${ProjectName}-baked-image-recipe
      # Bumped with the component: the ComponentArn change forces recipe
      # replacement, and Image Builder refuses to recreate an existing
      # Name/Version pair.
      Version: 1.0.2
      ParentImage: !Ref ImageBuilderParentImage
      Components:
        - ComponentArn: !Ref BakedImageComponent
  BakedImageInfrastructure:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Condition: EnableImageBuilderCondition
    Properties:
      Name: !Sub ${ProjectName}-baked-image-infra
      InstanceProfileName: !Sub ${ProjectName}-baked-imagebuilder-instance-profile
      # GPU-class instance: the bake compiles the NVIDIA driver floor for the
      # image's kernels (DKMS) and enables nvidia-persistenced; a t3 bake
      # produced an AMI that failed the launch-time driver-floor gate.
      InstanceTypes:
        - g4dn.xlarge
      TerminateInstanceOnFailure: true
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
  BakedImageDistribution:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Condition: EnableImageBuilderCondition
    Properties:
      Name: !Sub ${ProjectName}-baked-image-distribution
      Distributions:
        - Region: !Ref "AWS::Region"
          AmiDistributionConfiguration:
            Name: !Sub ${ProjectName}-baked-ami-{{ imagebuilder:buildDate }}
          # Native publish: during the DISTRIBUTION phase Image Builder writes
          # the output AMI id to this parameter. SsmParameterConfigurations is a
          # SIBLING of AmiDistributionConfiguration, not nested inside it; the
          # pipeline execution role performs the write.
          SsmParameterConfigurations:
            - ParameterName: !Sub /${ProjectName}/ami/baked/latest
              DataType: aws:ec2:image
  BakedImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Condition: EnableImageBuilderCondition
    Properties:
      Name: !Sub ${ProjectName}-baked-image-pipeline
      Status: ENABLED
      ImageRecipeArn: !Ref BakedImageRecipe
      InfrastructureConfigurationArn: !Ref BakedImageInfrastructure
      DistributionConfigurationArn: !Ref BakedImageDistribution
      # The execution role lives in the operator stack under a fixed
      # ProjectName-derived name; pass it by ARN so the pipeline actually runs.
      ExecutionRole: !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-imagebuilder-execution-role
  SpotAlertTopic:
    Type: AWS::SNS::Topic
    Condition: EnableSpotAlertsCondition
    Properties:
      TopicName: !Sub ${ProjectName}-spot-alerts
  SpotAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableSpotAlertsCondition
    Properties:
      Protocol: email
      Endpoint: !Ref SpotAlertEmail
      TopicArn: !Ref SpotAlertTopic
  SpotInterruptionRule:
    Type: AWS::Events::Rule
    Condition: EnableSpotAlertsCondition
    Properties:
      Name: !Sub ${ProjectName}-spot-interruption
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Spot Instance Interruption Warning
      Targets:
        - Arn: !Ref SpotAlertTopic
          Id: spot-interruption
          InputTransformer:
            InputPathsMap:
              instance: $.detail.instance-id
              region: $.region
            InputTemplate: '"Spot interruption warning for <instance> in <region>"'
Outputs:
  VpcId:
    Value: !Ref Vpc
  SubnetId:
    Value: !Ref PublicSubnet
  SecurityGroupId:
    Value: !Ref SecurityGroup
  InstanceProfileName:
    Value: !Sub ${ProjectName}-instance-profile
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CertBucketName:
    Value: !If [CertBucketEnabledCondition, !Ref CertBucket, ""]
  DdnsHost:
    Value: !If [HasDdnsHost, !Ref DdnsHost, "-"]
  ReleaseTag:
    Value: !Ref ReleaseTag
  ReleaseManifestSha256:
    Value: !Ref ReleaseManifestSha256

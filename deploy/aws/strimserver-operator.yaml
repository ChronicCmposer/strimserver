AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  strimserver operator identity: the account-global IAM surface the lifecycle
  scripts authenticate as and pass to AWS services. It creates the project IAM
  user and its single least-privilege operator managed policy, the EC2 instance
  role/profile used by launched GPU instances, a max-permissions boundary that
  caps that role, and every Image Builder role (build instance role/profile,
  service execution role, AMI-publish role). IAM is account-global, so this
  template is deployed ONCE per account as strimserver-operator by
  deploy/aws/provision-account with ADMIN credentials; the regional
  strimserver-infra stack is deployed afterwards as this identity and references
  the roles/profile above by their deterministic names. Keeping the roles here
  (rather than in the regional stack) lets the operator policy grant
  iam:PassRole on them without a circular dependency.

Parameters:
  ProjectName:
    Type: String
    Default: strimserver
    AllowedPattern: "[a-z0-9-]+"
    MaxLength: 30
    ConstraintDescription: "must match [a-z0-9-]+ and be at most 30 characters (S3 bucket names require lowercase; global IAM names have a 64-character cap)"
    Description: >
      Name/tag prefix. Every IAM/S3/CloudFormation/Image Builder/SSM resource
      ARN below derives from it, so infra and the operator policy must be
      deployed with the same value. The infra stack name MUST equal this value
      (the lifecycle scripts reject a --stack-name that differs) so the
      stack/role/profile ARNs stay in lockstep.

  DeploymentBucketName:
    Type: String
    Default: ""
    Description: >
      Optional S3 bucket name (no s3:// prefix) holding the deployment tars.
      When set, the operator policy's bucket config/object grants, the instance
      role's DeploymentBucketRead policy and the boundary's bucket reads are
      enabled; when empty those statements are omitted entirely (an empty name
      would yield a malformed ARN). deploy/aws/deploy-infra owns the
      S3_BUCKET_NAME override for the regional stack; supply this on the
      operator stack when the bucket policy needs the operator identity.

  EnableSessionManager:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Attach AmazonSSMManagedInstanceCore to the EC2 instance role so launched
      instances are reachable through SSM Session Manager as a fallback if SSH
      is misconfigured.

Conditions:
  HasBucket: !Not [!Equals [!Ref DeploymentBucketName, ""]]
  UseSsm: !Equals [!Ref EnableSessionManager, "true"]

Resources:
  # ----------------------------------------------------------------------------
  # EC2 instance role/profile for launched GPU streaming instances.
  # ----------------------------------------------------------------------------
  # The boundary is declared later in this template and referenced only through
  # a !Sub string, so CloudFormation cannot infer the dependency. Create the
  # policy first or CreateRole fails with a nonexistent permissions boundary.
  InstanceRole:
    Type: AWS::IAM::Role
    DependsOn: StrimserverOperatorBoundary
    Properties:
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ProjectName}-boundary"
      RoleName: !Sub "${ProjectName}-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        !If
          - UseSsm
          - - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
          - !Ref AWS::NoValue
      Policies:
        # The baked-AMI SSM parameter is the one piece of state the instance
        # role may read: deploy/aws/launch resolves it before the DLAMI
        # fallback. Scope to the single parameter, never a wildcard. The region
        # segment is wildcarded because this role is account-global.
        - PolicyName: SsmBakedAmiRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/ami/baked/latest"
        - !If
          - HasBucket
          - PolicyName: DeploymentBucketRead
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ["s3:GetObject"]
                  Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}/*"
                - Effect: Allow
                  Action: ["s3:ListBucket"]
                  Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}"
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-instance-profile"
      Roles: [!Ref InstanceRole]

  # ----------------------------------------------------------------------------
  # IAM service account - strimserver check-deps AMI resolver + operator.
  # ----------------------------------------------------------------------------
  StrimserverServiceUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref ProjectName
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Project-scoped operator policy (decision 11b): the service user is also the
  # project operator, so the operator surface its own tooling (deploy/aws/launch,
  # deploy/aws/terminate, deploy/aws/deploy-infra and the scripts/tools publish
  # helpers) actually calls is attached here. provision-account bootstraps this
  # stack ONCE with admin credentials; thereafter deploy-infra runs as THIS
  # identity, so the policy covers the scoped CloudFormation deploy lifecycle and
  # the Image Builder rebuild surface without granting account-wide IAM
  # administration. It also serves the check-deps DLAMI resolver via the
  # SsmDlamiLookup + Ec2Describe grants. This is the SINGLE managed policy
  # attached to the user (CloudFormation cannot reliably manage two
  # AWS::IAM::ManagedPolicy resources attached to one user).
  StrimserverOperatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-operator"
      Description: >-
        Least-privilege operator surface for the strimserver account: publish
        artifacts to the deployment bucket, deploy the strimserver stack, read
        its outputs, resolve the DLAMI, launch/terminate tagged GPU instances,
        rebuild the baked AMI, hand the template's roles only to their services,
        and rotate its own access key. No account-wide IAM administration and no
        DNS-zone management is granted: this project owns no hosted zone.
      Users:
        - !Ref StrimserverServiceUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Bucket-level config used by scripts/bucket-cidr-policy.sh
          # (get-bucket-location / get- / put-bucket-policy) and by the publish
          # helpers' list-objects-v2. Scoped to the one deployment bucket the
          # stack is parameterised with (DeploymentBucketName); omitted entirely
          # when no bucket is configured, mirroring the InstanceRole's
          # DeploymentBucketRead policy (an empty bucket name would otherwise
          # yield a malformed ARN).
          - !If
            - HasBucket
            - Sid: S3BucketConfig
              Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
                - s3:GetBucketPolicy
                - s3:PutBucketPolicy
              Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}"
            - !Ref AWS::NoValue
          # Object uploads from the publish helpers (`aws s3 cp`) plus the
          # object-ACL flip that scripts/bucket-cidr-policy.sh performs under
          # MAKE_PRIVATE=1 (`s3api put-object-acl --acl private`). Scoped to the
          # deployment bucket's objects.
          - !If
            - HasBucket
            - Sid: S3Objects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}/*"
            - !Ref AWS::NoValue
          # M2: split the EC2 lifecycle so the operator can only touch instances
          # it launched. RunInstances is itself split in two: the instance
          # statement is gated by the Project request tag (the tag launch applies
          # via --tag-specifications) plus an instance-type allowlist, while the
          # referenced dependencies (volume/ENI/key-pair/SG/subnet/image) carry
          # their own unconditioned grant; TerminateInstances by the Project
          # resource tag; CreateTags/DeleteTags (tag-on-create) by
          # ec2:CreateAction = RunInstances on instance ARNs. Describe* stay
          # Resource:"*" WITHOUT conditions: EC2 Describe actions do not support
          # resource-level permissions, so a ResourceTag condition would
          # evaluate false and deny them, breaking terminate's instance lookup.
          #
          # The region segment is wildcarded (movienight parity): the operator
          # identity is account-global and may drive more than one region.
          - Sid: Ec2Describe
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              # ec2:DescribeImages also backs the check-deps DLAMI metadata
              # resolver, which reads Images[0].[Name,CreationDate].
              - ec2:DescribeImages
              # VPC/IGW/route-table reads back the infra stack's self-contained
              # network (and the network-lifecycle deploy).
              - ec2:DescribeVpcs
              - ec2:DescribeInternetGateways
              - ec2:DescribeRouteTables
            Resource: "*"
          # ec2:RunInstances is authorized against EVERY resource the request
          # references (the instance, its root volume, the network interface, the
          # key pair, the security group, the subnet and the AMI), not just the
          # instance. The RequestTag/Project condition can only hold for the
          # instance: launch applies --tag-specifications to the instance alone,
          # so a single tag-gated statement on Resource:"*" fails authorization on
          # the key-pair (and on the SG/subnet/image/volume/ENI). The grant is
          # therefore split: the instance keeps the RequestTag + instance-type
          # gates, and the referenced resources get their own unconditioned grant.
          #
          # The dependency grant is intentionally unconditioned: ec2:InstanceType
          # is absent from the authorization context for the referenced resources,
          # so any StringLike gate there would never match and would leave
          # ec2:RunInstances denied. Safety comes from the gated instance
          # statement, which IAM still requires for the instance ARN. Public AMIs
          # live in the empty-account ARN namespace, so image/* must NOT carry
          # ${AWS::AccountId}.
          - Sid: Ec2RunInstances
            Effect: Allow
            Action:
              - ec2:RunInstances
            Resource: !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                "aws:RequestTag/Project": !Ref ProjectName
              StringLike:
                "ec2:InstanceType":
                  - "g4dn.*"
                  - "g5g.*"
                  - "g6.*"
          - Sid: Ec2RunInstancesDependencies
            Effect: Allow
            Action:
              - ec2:RunInstances
            Resource:
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:volume/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:network-interface/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:key-pair/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:subnet/*"
              - !Sub "arn:aws:ec2:*::image/*"
          # Instance tag-on-create (launch's --tag-specifications) needs
          # ec2:CreateTags/DeleteTags on instance ARNs. ec2:CreateAction ==
          # RunInstances binds the grant to tag-on-create: a standalone
          # CreateTags/DeleteTags call has no ec2:CreateAction key, so it cannot
          # stamp Project=<name> onto a foreign instance and then terminate it.
          # The TagKeys allowlist limits the keys to exactly the Project/Name
          # pair launch applies.
          #
          # No aws:ResourceTag condition here: tag-on-create (RunInstances
          # --tag-specifications) is authorized before the instance exists, so a
          # ResourceTag condition would DENY every launch. The network-lifecycle
          # CreateTags/DeleteTags on VPC resources below stay UNCONDITIONED
          # because CloudFormation tags network resources outside RunInstances.
          - Sid: Ec2CreateTags
            Effect: Allow
            Action:
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                "ec2:CreateAction": RunInstances
              ForAllValues:StringEquals:
                "aws:TagKeys":
                  - Project
                  - Name
          - Sid: Ec2TerminateInstances
            Effect: Allow
            Action:
              - ec2:TerminateInstances
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/Project": !Ref ProjectName
          # launch/terminate read the stack outputs; deploy-infra additionally
          # reads the stack status/events and fetches the template for a diff.
          # Scoped to the regional stack, region-wildcarded.
          - Sid: CloudFormationReadStack
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
            Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}/*"
          # `aws cloudformation deploy` validates the template with
          # GetTemplateSummary before it touches the stack. That action does NOT
          # support resource-level permissions, so it cannot be folded into the
          # stack-scoped statements above; it must live in its own statement on
          # Resource:"*". Without this grant deploy fails with AccessDenied.
          - Sid: CloudFormationGetTemplateSummary
            Effect: Allow
            Action:
              - cloudformation:GetTemplateSummary
            Resource: "*"
          # deploy-infra runs `aws cloudformation deploy` as this identity. The
          # CLI implements deploy with a change set, so the change-set lifecycle
          # is required alongside CreateStack/UpdateStack. DeleteStack lets the
          # operator recover its own ROLLBACK_COMPLETE stack (scoped to this
          # project's stack only -- never another stack).
          - Sid: CloudFormationDeployStack
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
            Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}/*"
          - Sid: SsmDlamiLookup
            Effect: Allow
            Action: ssm:GetParameter
            Resource:
              - !Sub "arn:aws:ssm:*::parameter/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-amazon-linux-2023/latest/ami-id"
              - !Sub "arn:aws:ssm:*::parameter/aws/service/deeplearning/ami/arm64/base-oss-nvidia-driver-gpu-amazon-linux-2023/latest/ami-id"
              # launch reads the baked-AMI parameter before the DLAMI fallback;
              # the operator identity is the only one that runs launch.
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/ami/baked/latest"
          - Sid: SelfKeyRotation
            Effect: Allow
            Action:
              - iam:ListAccessKeys
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:user/${ProjectName}"
          # launch passes the stack's instance role to run-instances; constrain
          # it to EC2 so the role can never be handed to another principal that
          # could escalate by assuming it.
          - Sid: PassStrimserverRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-instance-role"
            Condition:
              StringEquals:
                "iam:PassedToService": ec2.amazonaws.com
          # deploy-infra re-deploys the regional template, which wires these
          # roles into Image Builder, the instance profile and the EventBridge
          # target. CloudFormation must therefore be able to pass exactly those
          # roles (never an arbitrary role) to their services. The roles live in
          # THIS template, so their ARNs are constructed deterministically from
          # the fixed names below -- no cross-stack reference and no cycle.
          - Sid: PassImageBuilderRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-baked-imagebuilder-instance-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-baked-imagebuilder-execution-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-baked-publish-role"
            Condition:
              StringEquals:
                "iam:PassedToService":
                  - ec2.amazonaws.com
                  - imagebuilder.amazonaws.com
                  - events.amazonaws.com
                  - ssm.amazonaws.com
          # Manual baked-AMI rebuild: trigger the one pipeline the infra stack
          # owns.
          - Sid: ImageBuilderRebuild
            Effect: Allow
            Action:
              - imagebuilder:StartImagePipelineExecution
            Resource: !Sub "arn:aws:imagebuilder:*:${AWS::AccountId}:image-pipeline/${ProjectName}-baked"
          # Read/watch surface for a rebuild. Image Builder list actions do not
          # support resource-level permissions, so those stay Resource:"*".
          - Sid: ImageBuilderRead
            Effect: Allow
            Action:
              - imagebuilder:GetImagePipeline
              - imagebuilder:GetImage
              - imagebuilder:GetImageRecipe
              - imagebuilder:ListImagePipelines
              - imagebuilder:ListImages
              - imagebuilder:ListImageBuildVersions
            Resource: "*"
          # D.3: the infra stack creates and updates the Image Builder
          # component/recipe/infrastructure/distribution/pipeline as this
          # identity. Scoped to the account's Image Builder ARNs, region-wild.
          - Sid: ImageBuilderLifecycle
            Effect: Allow
            Action:
              - imagebuilder:CreateComponent
              - imagebuilder:DeleteComponent
              - imagebuilder:CreateImageRecipe
              - imagebuilder:DeleteImageRecipe
              - imagebuilder:CreateInfrastructureConfiguration
              - imagebuilder:UpdateInfrastructureConfiguration
              - imagebuilder:DeleteInfrastructureConfiguration
              - imagebuilder:CreateDistributionConfiguration
              - imagebuilder:UpdateDistributionConfiguration
              - imagebuilder:DeleteDistributionConfiguration
              - imagebuilder:CreateImagePipeline
              - imagebuilder:UpdateImagePipeline
              - imagebuilder:DeleteImagePipeline
            Resource: !Sub "arn:aws:imagebuilder:*:${AWS::AccountId}:*"
          # D.3: the EventBridge rule that publishes the baked-AMI id. Scoped to
          # the one rule the infra stack owns.
          - Sid: BakedAmiEventsLifecycle
            Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
              - events:DeleteRule
              - events:DescribeRule
              - events:ListTargetsByRule
              - events:EnableRule
              - events:DisableRule
            Resource: !Sub "arn:aws:events:*:${AWS::AccountId}:rule/${ProjectName}-baked-ami-publish"
          # D.3: the SSM automation document that writes the baked-AMI id.
          # ssm:CreateDocument does NOT support resource-level permissions, so
          # this statement must stay Resource:"*" (the read/update/delete
          # actions are folded in here rather than split for simplicity).
          - Sid: SsmDocumentLifecycle
            Effect: Allow
            Action:
              - ssm:CreateDocument
              - ssm:UpdateDocument
              - ssm:DeleteDocument
              - ssm:DescribeDocument
              - ssm:GetDocument
            Resource: "*"
          # The self-contained VPC (VPC + public subnet + IGW + route table +
          # GPU security group) strimserver-infra.yaml creates. Resource-scoped
          # where EC2 supports it; ec2:CreateTags/DeleteTags cover the Project/
          # Name tags every one of those resources carries.
          #
          # This statement is deliberately left WITHOUT an aws:TagKeys allowlist
          # and WITHOUT an ec2:CreateAction condition: CloudFormation issues a
          # separate CreateTags call carrying only the reserved
          # aws:cloudformation:* keys when it creates/updates these resources, so
          # either gate here would deny those calls and break `deploy`. Instance
          # tag-on-create is hardened separately above.
          - Sid: Ec2VpcLifecycle
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource:
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:vpc/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:subnet/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:internet-gateway/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:route-table/*"
              - !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"

  # ----------------------------------------------------------------------------
  # Baked-AMI Image Builder roles (regional pipeline resources live in the infra
  # stack; the IAM they assume lives here so the operator can PassRole them).
  # ----------------------------------------------------------------------------
  # Build-instance role/profile: the service launches this profile and runs the
  # component steps on the build host.
  BakedImageBuilderInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-baked-imagebuilder-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BakedImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-baked-imagebuilder-instance-profile"
      Roles: [!Ref BakedImageBuilderInstanceRole]

  # Service execution role assumed by imagebuilder.amazonaws.com. Least
  # privilege: imagebuilder reads its own resources, EC2 lifecycle + tagging for
  # the throwaway build instance, iam:PassRole constrained to EC2, and
  # ssm:PutParameter on the single baked-AMI parameter (plus build logs).
  BakedImageBuilderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-baked-imagebuilder-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: imagebuilder.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageBuilderAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ImageBuilderResources
                Effect: Allow
                Action:
                  - imagebuilder:GetComponent
                  - imagebuilder:GetImageRecipe
                  - imagebuilder:GetInfrastructureConfiguration
                  - imagebuilder:GetDistributionConfiguration
                  - imagebuilder:GetImagePipeline
                  - imagebuilder:GetImage
                  - imagebuilder:ListImageBuildVersions
                  - imagebuilder:CreateImage
                  - imagebuilder:StartImagePipelineExecution
                Resource: !Sub "arn:aws:imagebuilder:*:${AWS::AccountId}:*"
              - Sid: BuildInstanceLifecycle
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: PassImageBuilderInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BakedImageBuilderInstanceRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": ec2.amazonaws.com
              - Sid: PublishBakedAmiId
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/ami/baked/latest"
              - Sid: BuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/imagebuilder/*"

  # Publish role: started by the infra stack's EventBridge rule to run the SSM
  # automation document that writes the baked AMI id. The document lives in the
  # infra stack with a deterministic name, so this role can scope to its ARN.
  BakedAmiPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-baked-publish-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
                - ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishBakedAmi
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartBakedAmiAutomation
                Effect: Allow
                Action: ssm:StartAutomationExecution
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:automation-definition/${ProjectName}-baked-ami-publish:*"
              - Sid: WriteBakedAmiParameter
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/ami/baked/latest"

  # Permissions boundary (M2 residual): a MAX-permissions cap that the global
  # instance role must carry. It is derived from the global InstanceRole above
  # -- the SSM agent action set plus project-scoped SSM and S3 reads -- so the
  # GPU instance keeps working. It grants no IAM, EC2 or CloudFormation
  # management actions, so an attached inline admin policy cannot lift a capped
  # role above this ceiling. Allow-only (no Deny), effective permissions are
  # identity ∩ boundary. It is deliberately NOT attached to the operator user,
  # which would cap the operator's own legitimate deploy rights.
  #
  # Bootstrap order: provision-account (admin) deploys this stack, so the policy
  # ARN exists before the InstanceRole above is created.
  StrimserverOperatorBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-boundary"
      Description: >-
        Max-permissions boundary for the strimserver instance role: the SSM
        agent action set plus project-scoped SSM and S3 reads.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # AmazonSSMManagedInstanceCore-equivalent: the instance must reach
          # SSM so the operator can run remote `setup` without SSH. The actions
          # are enumerated rather than wildcarded so a compromised operator
          # writing an inline policy onto a bounded role cannot use the boundary
          # as a ceiling that still permits every SSM parameter read or session
          # start.
          - Sid: SsmAgent
            Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:DescribeDocument
              - ssm:GetManifest
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutInventory
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: "*"
          # Parameter reads are scoped to this project's namespace, NOT
          # Resource:"*": a boundary-wide GetParameter would let any capped role
          # read every parameter in the account. Region wildcarded so the
          # account-global role works in any region.
          - Sid: ReadProjectParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/*"
          # The public AWS-managed service namespace is read-only and shared by
          # every region.
          - Sid: ReadPublicAwsServiceParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub "arn:aws:ssm:*::parameter/aws/service/*"
          # Bucket-level S3 the instance role needs (ListBucket for the
          # deployment bucket reads), scoped to the configured bucket.
          - !If
            - HasBucket
            - Sid: DeploymentBucketList
              Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}"
            - !Ref AWS::NoValue
          # Object-level S3: the deployment tar reads.
          - !If
            - HasBucket
            - Sid: DeploymentBucketObjects
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${DeploymentBucketName}/*"
            - !Ref AWS::NoValue

Outputs:
  OperatorUserName:
    Description: IAM user name the operator scripts authenticate as.
    Value: !Ref StrimserverServiceUser
    Export:
      Name: !Sub "${AWS::StackName}-OperatorUserName"

  OperatorUserArn:
    Description: ARN of the operator IAM user.
    Value: !GetAtt StrimserverServiceUser.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OperatorUserArn"

  InstanceRoleName:
    Description: Name of the EC2 instance role launched instances assume.
    Value: !Ref InstanceRole
    Export:
      Name: !Sub "${AWS::StackName}-InstanceRoleName"

  InstanceRoleArn:
    Description: ARN of the EC2 instance role (referenced by the infra stack).
    Value: !GetAtt InstanceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-InstanceRoleArn"

  InstanceProfileName:
    Description: Name of the EC2 instance profile launch passes to run-instances.
    Value: !Ref InstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-InstanceProfileName"

  BakedImageBuilderInstanceRoleName:
    Description: Name of the Image Builder build-instance role.
    Value: !Ref BakedImageBuilderInstanceRole
    Export:
      Name: !Sub "${AWS::StackName}-BakedImageBuilderInstanceRoleName"

  BakedImageBuilderInstanceRoleArn:
    Description: ARN of the Image Builder build-instance role.
    Value: !GetAtt BakedImageBuilderInstanceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BakedImageBuilderInstanceRoleArn"

  BakedImageBuilderInstanceProfileName:
    Description: Name of the Image Builder build-instance profile.
    Value: !Ref BakedImageBuilderInstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-BakedImageBuilderInstanceProfileName"

  BakedImageBuilderExecutionRoleArn:
    Description: ARN of the Image Builder service execution role.
    Value: !GetAtt BakedImageBuilderExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BakedImageBuilderExecutionRoleArn"

  BakedAmiPublishRoleArn:
    Description: ARN of the AMI-publish role used by the EventBridge rule.
    Value: !GetAtt BakedAmiPublishRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BakedAmiPublishRoleArn"

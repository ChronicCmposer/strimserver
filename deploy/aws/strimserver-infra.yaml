AWSTemplateFormatVersion: "2010-09-09"

Description: >
  strimserver regional infrastructure: an OPTIONAL self-contained networking
  layer (VPC + public subnet + internet gateway), the security group for
  ephemeral GPU streaming instances, and the baked-AMI Image Builder pipeline
  (component/recipe/infra/distribution/pipeline) plus the EventBridge->SSM
  automation that publishes the baked AMI id. Instances are created and
  terminated imperatively by deploy/aws/launch and deploy/aws/terminate, which
  read this stack's outputs. The IAM user, operator policy, EC2 instance
  role/profile and Image Builder roles live in the account-global
  strimserver-operator stack (deployed first by provision-account); this
  regional stack references them by deterministic names. No EC2 launch template
  is created or required.

Parameters:
  ProjectName:
    Type: String
    Default: strimserver
    Description: >
      Name/tag prefix. launch tags instances with Project=<ProjectName> and
      terminate matches on that tag. Keep it stable across launch/terminate.
    AllowedPattern: "[A-Za-z0-9-]+"

  CreateNetwork:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      true  -> create a dedicated VPC + public subnet + internet gateway for
               strimserver (use this if you have no default VPC or no suitable
               public subnet). VpcId is ignored.
      false -> use the existing VpcId you supply.

  VpcId:
    Type: String
    Default: ""
    Description: >
      Existing VPC id for the security group when CreateNetwork=false. Leave
      empty when CreateNetwork=true. Required if CreateNetwork=false.
    AllowedPattern: '^(vpc-[0-9a-f]+)?$'
    ConstraintDescription: Must be a vpc-... id, or empty when CreateNetwork=true.

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR for the created VPC (only used when CreateNetwork=true).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  SubnetCidr:
    Type: String
    Default: "10.0.0.0/24"
    Description: CIDR for the created public subnet (only used when CreateNetwork=true).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  OperatorCidr:
    Type: String
    Description: >
      CIDR allowed to reach SSH (22) and the controller HTTP/WebSocket port.
      Use your operator machine's public IP as a /32 (e.g. 203.0.113.4/32).
      Avoid 0.0.0.0/0 here.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR, e.g. 203.0.113.4/32

  IngestCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR allowed to reach the SRT ingest UDP port. Encoder IPs are often
      dynamic and SRT is passphrase-encrypted, so the default is open; tighten
      to your encoder's IP if it is static.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  ControllerPort:
    Type: Number
    Default: 4000
    MinValue: 1
    MaxValue: 65535
    Description: Must match CONTROLLER_HTTP_PORT in strimserver.env.

  SrtPort:
    Type: Number
    Default: 9000
    MinValue: 1
    MaxValue: 65535
    Description: Must match STRIMSERVER_SRT_PORT in strimserver.env.

  DeploymentBucketName:
    Type: String
    Default: ""
    Description: >
      Optional S3 bucket name (no s3:// prefix) holding the deployment tars.
      Retained on this stack only because deploy-infra re-passes every live
      parameter verbatim; the bucket-scoped IAM now lives in the
      strimserver-operator stack (set it there to enable the grants).

  EnableSessionManager:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Retained on this stack only because deploy-infra re-passes every live
      parameter verbatim. The instance role that consumes it (attaching
      AmazonSSMManagedInstanceCore) is owned by the strimserver-operator stack.

  EnableExperimentalSsh:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Open the experimental OpenSSH port (from OperatorCidr). The
      openssh-experimental RPM is always bundled with the deployment package
      (fetched from the pinned @openssh_dist artifact), so set this to true to
      open the port for it; false keeps the port closed.

  ExperimentalSshPort:
    Type: Number
    Default: 2222
    MinValue: 1
    MaxValue: 65535
    Description: >
      Port the experimental sshd binds (must match 'Port' in
      tools/openssh/sshd_config; default 2222). Only used when
      EnableExperimentalSsh=true.

  NvidiaDriverFloor:
    Type: String
    Default: "620.70.06"
    AllowedPattern: '^[0-9]+([.][0-9]+)*$'
    Description: >
      NVIDIA driver floor baked into the AMI. MUST equal NVIDIA_DRIVER_FLOOR in
      deploy/aws/lib/nvidia.sh; deploy_infra_test.sh enforces that equality, so
      a floor bump updates the tag and the component together. It is also the
      value of the strimserver:nvidia-driver AMI tag.

  NvidiaFloorMachineryUrl:
    Type: String
    Default: "https://raw.githubusercontent.com/ChronicCmposer/strimserver/dev/deploy/aws/lib/nvidia.sh"
    Description: >
      Location of the repo's lib/nvidia.sh -- the single source of truth for the
      driver floor and the stage-then-swap upgrade. The Image Builder component
      sources it instead of duplicating the floor logic. Point this at the exact
      revision you are deploying (a fork or a release tag).

  OpensshExperimentalRpmUrl:
    Type: String
    Default: "https://github.com/ChronicCmposer/strimserver/releases/download/openssh-dist/openssh-experimental.rpm"
    Description: >
      The pinned @openssh_dist openssh-experimental RPM (see MODULE.bazel
      s3_key "openssh/openssh-experimental.rpm") baked into the image.

# Guard: if you are not creating a network, you must supply an existing VPC.
Rules:
  RequireVpcWhenNotCreating:
    RuleCondition:
      Fn::Equals: [!Ref CreateNetwork, "false"]
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals: [!Ref VpcId, ""]
        AssertDescription: >
          VpcId is required when CreateNetwork=false. Set CreateNetwork=true to
          have the stack create a VPC for you, or provide an existing VpcId.

Conditions:
  CreateNet: !Equals [!Ref CreateNetwork, "true"]
  EnableExpSsh: !Equals [!Ref EnableExperimentalSsh, "true"]

Resources:
  # ----------------------------------------------------------------------------
  # Optional networking (created only when CreateNetwork=true)
  # ----------------------------------------------------------------------------
  ManagedVpc:
    Type: AWS::EC2::VPC
    Condition: CreateNet
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  ManagedIgw:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNet
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  ManagedIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNet
    Properties:
      VpcId: !Ref ManagedVpc
      InternetGatewayId: !Ref ManagedIgw

  ManagedSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNet
    Properties:
      VpcId: !Ref ManagedVpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet"

  ManagedRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNet
    Properties:
      VpcId: !Ref ManagedVpc
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"

  ManagedDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNet
    DependsOn: ManagedIgwAttachment
    Properties:
      RouteTableId: !Ref ManagedRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ManagedIgw

  ManagedSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNet
    Properties:
      SubnetId: !Ref ManagedSubnet
      RouteTableId: !Ref ManagedRouteTable

  # ----------------------------------------------------------------------------
  # Security group (always) - lives in the managed VPC or your existing one
  # ----------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ingress/egress for GPU streaming instances"
      VpcId: !If [CreateNet, !Ref ManagedVpc, !Ref VpcId]
      SecurityGroupIngress:
        - Description: SSH from operator
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref OperatorCidr
        - Description: Controller HTTP/WebSocket from operator
          IpProtocol: tcp
          FromPort: !Ref ControllerPort
          ToPort: !Ref ControllerPort
          CidrIp: !Ref OperatorCidr
        - Description: SRT ingest (UDP) from encoder
          IpProtocol: udp
          FromPort: !Ref SrtPort
          ToPort: !Ref SrtPort
          CidrIp: !Ref IngestCidr
      SecurityGroupEgress:
        # Allow-all egress is required for: S3 bundle pull, RTMP to Twitch,
        # dnf package installs during deploy, and GitHub release downloads.
        - Description: All outbound
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub "${ProjectName}-sg"

  ExperimentalSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableExpSsh
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      Description: Experimental OpenSSH from operator
      IpProtocol: tcp
      FromPort: !Ref ExperimentalSshPort
      ToPort: !Ref ExperimentalSshPort
      CidrIp: !Ref OperatorCidr

  # ----------------------------------------------------------------------------
  # Baked-AMI pipeline (EC2 Image Builder, fully defined in this template)
  # ----------------------------------------------------------------------------
  # Builds a strimserver base AMI from the pinned DLAMI so launch does not
  # reinstall the driver/tools on every boot. Bake scope: the NVIDIA driver at
  # the floor (via the repo's own floor machinery), htop, the bundled
  # openssh-experimental RPM, the canonical containerd root/state config, and
  # nvidia-persistenced enabled. App container images, env and config are NOT
  # baked; deploy.sh still owns those.
  #
  # Trigger: MANUAL only (the pipeline carries no Schedule). TODO: add a monthly
  # rebuild schedule once the baked image is the default launch path, and a
  # rebuild on a NvidiaDriverFloor bump.
  BakedImageComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: strimserver-baked-base
      Description: strimserver baked base (driver floor, htop, openssh, containerd)
      Platform: Linux
      Version: "1.0.0"
      ChangeDescription: initial baked base
      # Fn::Sub interpolates ONLY the two URL parameters; the sourced nvidia.sh
      # owns the floor version and the stage-then-swap logic, so a threshold
      # bump is a one-line change in deploy/aws/lib/nvidia.sh.
      Data: !Sub |
        name: strimserver-baked-base
        description: strimserver baked base
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallBaseTools
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      set -euo pipefail
                      # Canonical containerd root/state (deploy/aws/lib/deploy.sh
                      # deploy_prepend_containerd_root_state). Strip any existing
                      # pair first so a re-run never duplicates the TOML keys.
                      mkdir -p /etc/containerd
                      if [ -f /etc/containerd/config.toml ]; then
                        grep -vE '^[[:space:]]*(root|state)[[:space:]]*=' /etc/containerd/config.toml > /tmp/containerd.toml || true
                      else
                        : > /tmp/containerd.toml
                      fi
                      {
                        printf "root='/mnt/nvme/containerd'\n"
                        printf "state='/mnt/nvme/containerd-state'\n\n"
                        cat /tmp/containerd.toml
                      } > /etc/containerd/config.toml
                      dnf install -y htop
                      systemctl enable nvidia-persistenced
              - name: EstablishNvidiaDriverFloor
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      set -euo pipefail
                      # Single source of truth: deploy/aws/lib/nvidia.sh. The
                      # floor and the safe stage-then-swap upgrade live there;
                      # never duplicate NVIDIA_DRIVER_FLOOR in this template.
                      curl -fsSL "${NvidiaFloorMachineryUrl}" -o /tmp/nvidia.sh
                      # shellcheck disable=SC1091
                      . /tmp/nvidia.sh
                      SUDO="" nvidia_ensure_driver_floor
              - name: InstallExperimentalOpenSsh
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      set -euo pipefail
                      curl -fsSL "${OpensshExperimentalRpmUrl}" -o /tmp/openssh-experimental.rpm
                      dnf install -y /tmp/openssh-experimental.rpm

  BakedImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: strimserver-baked-recipe
      Version: "1.0.0"
      ParentImage: ami-0198b63ccfac121e8
      Components:
        - ComponentArn: !Ref BakedImageComponent
      Tags:
        Project: !Ref ProjectName
        "strimserver:nvidia-driver": !Ref NvidiaDriverFloor

  # The build-instance profile is owned by the operator stack; reference it by
  # the same deterministic name (no cross-stack ImportValue, matching the
  # movienight split convention).
  BakedInfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: strimserver-baked-infra
      InstanceProfileName: !Sub "${ProjectName}-baked-imagebuilder-instance-profile"
      InstanceTypes:
        - g4dn.xlarge
      TerminateInstanceOnFailure: true
      Tags:
        Project: !Ref ProjectName

  BakedDistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: strimserver-baked-dist
      Distributions:
        - Region: us-east-2
          AmiDistributionConfiguration:
            Name: "strimserver-baked-{{ imagebuilder:buildDate }}"
            AmiTags:
              Project: !Ref ProjectName
              "strimserver:nvidia-driver": !Ref NvidiaDriverFloor
      Tags:
        Project: !Ref ProjectName

  BakedImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: strimserver-baked
      Description: Manual rebuild of the strimserver baked base AMI
      ImageRecipeArn: !Ref BakedImageRecipe
      InfrastructureConfigurationArn: !Ref BakedInfrastructureConfiguration
      DistributionConfigurationArn: !Ref BakedDistributionConfiguration
      ImageTestsConfiguration:
        ImageTestsEnabled: false
      Status: ENABLED

  # Publish the produced AMI id to SSM when an Image Builder build becomes
  # AVAILABLE. The automation reads the AMI id from the Image Builder state
  # change event, so every pipeline run (manual or a future schedule) refreshes
  # /strimserver/ami/baked/latest without a rebuild of this stack.
  BakedAmiPublishDocument:
    Type: AWS::SSM::Document
    Properties:
      # Deterministic name: the AMI-publish ROLE lives in the operator stack and
      # scopes ssm:StartAutomationExecution to this ARN without a cross-stack
      # !Ref, so the name must be stable and ProjectName-derived.
      Name: !Sub "${ProjectName}-baked-ami-publish"
      DocumentType: Automation
      Content:
        schemaVersion: "0.3"
        description: Publish the baked strimserver AMI id to SSM.
        parameters:
          AmiId:
            type: String
            description: AMI id produced by the Image Builder pipeline.
        mainSteps:
          - name: putBakedAmiParameter
            action: aws:executeAwsApi
            inputs:
              Service: ssm
              Api: PutParameter
              Name: /strimserver/ami/baked/latest
              Value: "{{ AmiId }}"
              Type: String
              Overwrite: true

  BakedAmiPublishRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Publish the baked AMI id when the Image Builder image is AVAILABLE
      EventPattern:
        source:
          - aws.imagebuilder
        detail-type:
          - "EC2 Image Builder Image State Change"
        detail:
          state:
            status:
              - AVAILABLE
      Targets:
        - Id: PublishBakedAmiParameter
          Arn: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${ProjectName}-baked-ami-publish:$DEFAULT"
          # The role is created by the operator stack; use its deterministic ARN.
          RoleArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-baked-publish-role"
          InputTransformer:
            InputPathsMap:
              ami: "$.detail.outputResources.amis[0].image"
            InputTemplate: '{"AmiId": <ami>}'

Outputs:
  SecurityGroupId:
    Description: Read automatically by launch; folds into the instance's network interface.
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroupId"

  InstanceProfileName:
    Description: >
      Name of the operator-owned EC2 instance profile; launch passes it to
      run-instances. The profile itself lives in the strimserver-operator stack.
    Value: !Sub "${ProjectName}-instance-profile"
    Export:
      Name: !Sub "${AWS::StackName}-InstanceProfileName"

  InstanceRoleArn:
    Description: >
      ARN of the operator-owned EC2 instance role (informational; the role lives
      in the strimserver-operator stack).
    Value: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-instance-role"
    Export:
      Name: !Sub "${AWS::StackName}-InstanceRoleArn"

  ProjectName:
    Description: Tag value launch applies and terminate matches on.
    Value: !Ref ProjectName
    Export:
      Name: !Sub "${AWS::StackName}-ProjectName"

  VpcId:
    Description: VPC the security group lives in (managed or existing).
    Value: !If [CreateNet, !Ref ManagedVpc, !Ref VpcId]
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  SubnetId:
    Condition: CreateNet
    Description: >
      Public subnet created for strimserver. launch reads this automatically;
      you can also set it as SUBNET_ID in deploy/aws/.env.
    Value: !Ref ManagedSubnet
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId"

  DeploymentBucketName:
    Description: >
      Retained for deploy-infra's live-parameter passthrough. The bucket-scoped
      IAM that consumes it lives in the strimserver-operator stack.
    Value: !Ref DeploymentBucketName
    Export:
      Name: !Sub "${AWS::StackName}-DeploymentBucketName"

  EnableSessionManager:
    Description: >
      Retained for deploy-infra's live-parameter passthrough. The instance role
      that consumes it lives in the strimserver-operator stack.
    Value: !Ref EnableSessionManager
    Export:
      Name: !Sub "${AWS::StackName}-EnableSessionManager"

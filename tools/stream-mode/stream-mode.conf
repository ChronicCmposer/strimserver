# stream-mode policy + instrument configuration (zsh syntax; sourced by lib.zsh).
# Machine-local overrides go in ~/.config/stream-mode/stream-mode.conf (same syntax).
# See plans/stream-mode.md "Priority policy" for the rationale behind each value.

# --- priority policy (applied by priority-loop.zsh every PERIOD seconds) ---
OBS_NICE=-10            # OBS main process only (never the CEF "OBS Helper" processes)
FFMPEG_NICE=-10         # local-encoder ffmpeg; launchd's Nice=-10 normally makes this a no-op
SPOTIFY_NICE=-5         # Spotify main process only
FFMPEG_MATCH='ffmpeg .* -i unix://.*obs\.nut\.sock'   # pgrep -f pattern for the proxy ffmpeg

# Outcome of the Phase 3.2 DVS daemon-priority test: none | renice | taskpolicy
# (the ProcessType=Interactive plist variant is persistent and needs no loop action).
DVS_METHOD=none
DVS_NICE=-20
DVS_DAEMONS=(dvsd ptp conmon_server apec)
# Chromium's IPv6-reachability probe address. Without an IPv6 default route every probe is
# an RTM_MISS on the routing socket, which DVS treats as an interface change (plan 3.4);
# a host reject route makes the lookup match. preflight checks that it is present.
IPV6_PROBE_ADDR=2001:4860:4860::8888

BACKGROUND_APPS=("Obsidian" "Parallels Toolbox")   # taskpolicy -b (background band), -B on revert
QUIT_APPS=("zoom.us")                               # quit by 'on' (Discord removed 2026-09-15: user decision, it stays up during streams)

PERIOD=30               # priority-loop period, seconds

# --- instruments ---
MEM_INTERVAL=5          # memory-sampler period, seconds
TOP_RSS_INTERVAL=60     # memory-sampler: top processes by RSS → top-rss.log and by compressed memory → top-cmprs.log, seconds
TOP_CMPRS_N=15          # memory-sampler: processes per top-cmprs sample (`top -o cmprs`, background band, ~0.5 s CPU)
PM_INTERVAL_MS=10000    # powermetrics sample interval (5000 gave 2.5 GB in 7.5 h and a "Second underflow" per sample)
PM_SAMPLERS=cpu_power,gpu_power,thermal,tasks
OBS_WS_URL=ws://127.0.0.1:4455
OBS_STATS_INTERVAL=1    # seconds
SPINDUMP_MIN_INTERVAL=120   # seconds between stall spindumps
SPINDUMP_MAX=20             # per session
SPINDUMP_SECONDS=3
# Observer effect found on 2026-09-14: every one of the 6 HAL client-timeout episodes fell
# inside a `spindump -notarget` run (3 s of all-process sampling + 15-23 s symbolicating a
# 14-27 MB dump at ~700 ms/s CPU, under memory-pressure level 2), 7-15 s after a milder
# trigger. So: only the DVS triggers take a spindump (a HAL overload → spindump → worse HAL
# overload is self-fulfilling), it samples only the DVS daemons (-onlyTarget; 1.5 MB, ~4 s
# of symbolication) and runs in the background band (taskpolicy -b). SPINDUMP_TARGETS=()
# restores the round-1 all-process dump.
# Round 3 (Q5): dvs-rescan dropped from the triggers. The 33 burst dumps of Sep 15–16 all
# show the same dvsd stack (_SCNetworkInterfaceCopyAllWithPreferences → IOKit), the burst
# cause is now in route-monitor.log + the unified-log Continuity lines, symbolication took
# 81 s under pressure (2026-09-16 16:02:22) and the evening session hit the cap of 20.
# stall-watch still timestamps every burst in dvs-events.log (RESCAN_BURST_*), without a dump.
SPINDUMP_TRIGGERS=(dvs)                     # of: dvs (stall line), dvs-rescan (burst), hal (overload)
SPINDUMP_TARGETS=(dvsd conmon_server dvs_ape)   # processes sampled; first is the spindump target
RESCAN_BURST_N=15           # stall-watch: this many dvsd INTERFACE_CHANGE re-scans within …
RESCAN_BURST_WINDOW=30      # … this many seconds → dvs-rescan-burst event (and a spindump only if dvs-rescan is a trigger)

# --- watchdog (memory-sampler) ---
WATCHDOG_PRESSURE_LEVEL=2   # kern.memorystatus_vm_pressure_level: 1 normal, 2 warn, 4 critical
WATCHDOG_SWAP_GROWTH_MB=1024
WATCHDOG_NOTIFY_INTERVAL=300
# Footprint escalation (round 3, H8): when swap or the compressed logical footprint ("Pages
# stored in compressor") grows by ≥ WATCHDOG_FOOTPRINT_GROWTH_MB within WATCHDOG_FOOTPRINT_WINDOW s,
# run `footprint -p` for the FOOTPRINT_TOP_N biggest compressed-memory holders (from the last
# top-cmprs sample) into footprint-<ts>.txt, at most once per WATCHDOG_FOOTPRINT_INTERVAL s, and
# name them in the notification. The 2026-09-16 leak (~1 GB/min, ~46 GB, in the OBS tree) was
# swapped out and never appeared in top-rss.log.
WATCHDOG_FOOTPRINT_GROWTH_MB=2048
WATCHDOG_FOOTPRINT_WINDOW=600
WATCHDOG_FOOTPRINT_INTERVAL=600
FOOTPRINT_TOP_N=3

# --- preflight thresholds ---
MIN_FREE_GB=60
# Round 3 (Q1/Q2/Q4/Q7): preflight FAILS on Wi-Fi power on / awdl0 active (every Universal
# Control reconnect over AWDL cycles awdl0 and fires a 60–130-event DVS re-scan storm; H6) and
# WARNS on an Apple mobile device on the USB tree (each attach/detach is a 50–100-event burst),
# a non-link-local IPv6 address on LAN_IFACE (the router's ULA makes every Apple AAAA connect an
# RTM_MISS; H9) and a missing local-encoder socket (the evening's first Record failed 30 s
# before the encoder was up).
WIFI_IFACE=en0
LAN_IFACE=en8               # "USB 10/100/1G/2.5G LAN"; en7 is the Belkin Dante NIC (IPv4 only)
ENCODER_SOCK=$HOME/obs.nut.sock

# --- paths ---
DVS_LOG_DIR=/Library/Logs/Audinate/DanteVirtualSoundcard
DVS_TOOLS_DIR="/Library/Application Support/Audinate/DanteVirtualSoundcard/Tools"
DVS_DEBUG_CONFIG=/Library/Preferences/com.audinate.dante.DanteVirtualSoundcard.config.json
OBS_CONFIG_DIR="$HOME/Library/Application Support/obs-studio"
OBS_SCENE_COLLECTION="$OBS_CONFIG_DIR/basic/scenes/ChronicCmposer.json"
OBS_WS_CONFIG="$OBS_CONFIG_DIR/plugin_config/obs-websocket/config.json"
PARALLELS_LOG=/Library/Logs/parallels.log   # dispatcher log: VM state changes (sliced into parallels-vm.log at off)

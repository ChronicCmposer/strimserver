# ============================================================================
# diffcontainerd stage configuration — the SHARED inputs for the containerd
# differential harness (differential-containerd.sh).
#
# Both sides of the differential read THIS file:
#   * the x86-64 driver (diffcontainerd/driver.c) fills the Layout struct +
#     env-runtime block + per-stage ContainerConfigs from these values and
#     calls cc_ctr_oci_spec_fill / ctr_fill_mounts;
#   * the Go oracle (diffcontainerd/oracle.go) builds the equivalent OCI
#     records the Go controller (container_factory.go) would produce.
#
# The values mirror the repository's own defaults so the comparison runs the
# REAL stage configurations:
#   * Layout paths: paths.go DefaultLayout(hostRoot="/mnt/nvme")
#   * namespace:    envspec.go CONTAINERD_NAMESPACE example ("strimserver")
#   * container ids / snapshot ids / image names / log files:
#     envspec.go stage examples.
#
# Format: KEY=VALUE, one per line; '#' starts a comment.  No quoting.
# ============================================================================

# ---- Layout paths (paths.go DefaultLayout) -------------------------------
LAYOUT_ENV=/mnt/nvme/config/strimserver.env
LAYOUT_TRANSCODE=/mnt/nvme/bin/transcode.sh
LAYOUT_NOTIFY=/mnt/nvme/bin/notify.sh
LAYOUT_MEDIAMTX_TMPL=/mnt/nvme/config/mediamtx.yaml.template
LAYOUT_SRT_PASS=/mnt/nvme/srt-passphrase
LAYOUT_VIDEO_DIR=/mnt/nvme/video-files
LAYOUT_RESOLV_CONF=/run/systemd/resolve/resolv.conf
LAYOUT_TMP=/tmp

# ---- containerd namespace ------------------------------------------------
NAMESPACE=strimserver

# ---- MediaMTX stage (ContainerConfig) ------------------------------------
MEDIAMTX_ID=mediamtx
MEDIAMTX_SNAPSHOT=mediamtx-snapshot
MEDIAMTX_IMAGE=docker.io/library/mediamtx:latest
MEDIAMTX_LOG=/mnt/nvme/logs/mediamtx.log

# ---- Normalize stage -----------------------------------------------------
NORMALIZE_ID=normalize
NORMALIZE_SNAPSHOT=normalize-snapshot
NORMALIZE_IMAGE=docker.io/library/ffmpeg:latest
NORMALIZE_LOG=/mnt/nvme/logs/normalize.log

# ---- Scale-and-egress stage ----------------------------------------------
SCALE_ID=scale-and-egress
SCALE_SNAPSHOT=egress-snapshot
SCALE_IMAGE=docker.io/library/ffmpeg:latest
SCALE_LOG=/mnt/nvme/logs/egress.log

# ---- Single-stage-egress stage -------------------------------------------
SINGLE_ID=single-stage-egress
SINGLE_SNAPSHOT=egress-snapshot
SINGLE_IMAGE=docker.io/library/ffmpeg:latest
SINGLE_LOG=/mnt/nvme/logs/egress.log